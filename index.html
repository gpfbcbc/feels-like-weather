<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Feels Like Local</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Feels Like" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --font-body:'Satoshi', Inter, sans-serif;
      --text-xs: clamp(0.75rem, 0.72rem + 0.2vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.82rem + 0.28vw, 1rem);
      --text-base: clamp(1rem, 0.96rem + 0.2vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.8vw, 1.4rem);
      --text-xl: clamp(1.5rem, 1.25rem + 1.2vw, 2rem);
      --text-2xl: clamp(2.3rem, 1.7rem + 3.8vw, 4.4rem);
      --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.25rem; --space-6:1.5rem; --space-8:2rem; --space-10:2.5rem; --space-12:3rem;
      --color-bg:#f7f6f2; --color-surface:#fbfaf7; --color-surface-2:#f2efea; --color-surface-3:#ece8e2;
      --color-text:#28251d; --color-text-muted:#706d66; --color-text-faint:#9c988f; --color-border:#d8d4cc; --color-primary:#01696f; --color-primary-2:#0f8088; --color-text-inverse:#f8f7f3;
      --radius-sm:.75rem; --radius-md:1rem; --radius-lg:1.35rem; --radius-xl:1.75rem; --radius-full:999px;
      --shadow-sm:0 2px 12px rgb(25 20 10 / 0.06); --shadow-md:0 20px 40px rgb(25 20 10 / 0.10);
    }
    [data-theme="dark"] {
      --color-bg:#141311; --color-surface:#1b1917; --color-surface-2:#22201d; --color-surface-3:#2a2723;
      --color-text:#ede7dd; --color-text-muted:#b5aea3; --color-text-faint:#7f786f; --color-border:#36332f; --color-primary:#4f98a3; --color-primary-2:#6bb6c2; --color-text-inverse:#141311;
      --shadow-sm:0 2px 12px rgb(0 0 0 / 0.22); --shadow-md:0 20px 40px rgb(0 0 0 / 0.32);
    }
    * { box-sizing:border-box; }
    html { color-scheme: light dark; }
    body {
      margin:0; min-height:100vh; font-family:var(--font-body); font-size:var(--text-base); color:var(--color-text);
      background:
        radial-gradient(circle at top center, color-mix(in srgb, var(--color-primary) 14%, transparent), transparent 38%),
        linear-gradient(180deg, color-mix(in srgb, var(--color-surface) 65%, transparent), transparent 28%),
        var(--color-bg);
    }
    button, input { font:inherit; color:inherit; }
    .shell {
      max-width: 460px; margin: 0 auto; min-height: 100vh; padding:
      max(env(safe-area-inset-top), 16px)
      16px
      calc(24px + env(safe-area-inset-bottom));
    }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:var(--space-3); margin-bottom:var(--space-4); }
    .app-title { display:flex; flex-direction:column; gap:.2rem; }
    .app-title strong { font-size:var(--text-lg); line-height:1.1; }
    .app-title span { color:var(--color-text-muted); font-size:var(--text-sm); }
    .icon-btn {
      width:44px; height:44px; border-radius:var(--radius-full); border:1px solid color-mix(in srgb, var(--color-text) 10%, transparent);
      background:color-mix(in srgb, var(--color-surface) 88%, transparent); display:grid; place-items:center; cursor:pointer;
      box-shadow:var(--shadow-sm);
    }
    .hero {
      background:linear-gradient(180deg, color-mix(in srgb, var(--color-primary) 16%, var(--color-surface)), var(--color-surface));
      border:1px solid color-mix(in srgb, var(--color-text) 10%, transparent); border-radius:28px; padding:var(--space-5); box-shadow:var(--shadow-md);
      position:relative; overflow:hidden;
    }
    .hero::after {
      content:''; position:absolute; inset:auto -10% -20% auto; width:180px; height:180px; border-radius:50%;
      background:color-mix(in srgb, var(--color-primary-2) 14%, transparent); filter:blur(10px);
    }
    .place-row { display:flex; justify-content:space-between; gap:var(--space-3); align-items:flex-start; }
    .place-row .label { color:var(--color-text-muted); font-size:var(--text-sm); margin-bottom:.2rem; }
    .place-row .place { font-size:var(--text-xl); font-weight:700; line-height:1.05; max-width:12ch; }
    .status-pill {
      padding:.5rem .8rem; border-radius:var(--radius-full); font-size:var(--text-xs); color:var(--color-primary);
      background:color-mix(in srgb, var(--color-primary) 12%, transparent); white-space:nowrap;
    }
    .main-temp { font-size:var(--text-2xl); font-weight:700; line-height:.92; letter-spacing:-.05em; margin: var(--space-6) 0 var(--space-2); }
    .subline { color:var(--color-text-muted); font-size:var(--text-base); }
    .top-range { display:flex; gap:var(--space-3); margin-top:var(--space-4); flex-wrap:wrap; }
    .range-pill {
      padding:.7rem .9rem; border-radius:var(--radius-full);
      background:color-mix(in srgb, var(--color-surface) 84%, transparent);
      border:1px solid color-mix(in srgb, var(--color-text) 10%, transparent);
      font-size:var(--text-sm); color:var(--color-text-muted);
    }
    .range-pill strong { color:var(--color-text); }
    .hero-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-3); margin-top:var(--space-5); }
    .mini {
      background:color-mix(in srgb, var(--color-surface) 80%, transparent); border:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);
      border-radius:20px; padding:var(--space-3);
    }
    .mini .k { font-size:var(--text-xs); color:var(--color-text-muted); margin-bottom:.2rem; }
    .mini .v { font-weight:700; }
    .actions { display:grid; grid-template-columns:1fr auto; gap:var(--space-3); margin:var(--space-4) 0; }
    .search {
      display:flex; align-items:center; gap:.65rem; padding:0 .9rem; min-height:50px; border-radius:18px;
      background:color-mix(in srgb, var(--color-surface) 90%, transparent); border:1px solid color-mix(in srgb, var(--color-text) 10%, transparent);
    }
    .search input { flex:1; border:0; background:transparent; outline:none; min-width:0; }
    .primary-btn {
      min-height:50px; padding:0 1rem; border:0; border-radius:18px; background:var(--color-primary); color:var(--color-text-inverse);
      font-weight:700; cursor:pointer; box-shadow:var(--shadow-sm);
    }
    .stack { display:grid; gap:var(--space-4); margin-top:var(--space-4); }
    .section-title { display:flex; justify-content:space-between; align-items:end; gap:var(--space-3); }
    .section-title h2 { margin:0; font-size:var(--text-lg); }
    .section-title span { color:var(--color-text-muted); font-size:var(--text-sm); }
    .hourly-strip { display:grid; grid-auto-flow:column; grid-auto-columns:86px; gap:var(--space-3); overflow-x:auto; padding-bottom:4px; scrollbar-width:thin; }
    .hour-card, .day-card {
      background:color-mix(in srgb, var(--color-surface) 88%, transparent); border:1px solid color-mix(in srgb, var(--color-text) 10%, transparent);
      border-radius:22px; box-shadow:var(--shadow-sm);
    }
    .hour-card { padding:var(--space-4); }
    .hour-card time { display:block; color:var(--color-text-muted); font-size:var(--text-sm); margin-bottom:var(--space-4); }
    .hour-main { font-size:var(--text-lg); font-weight:700; }
    .hour-sub { color:var(--color-text-muted); font-size:var(--text-xs); margin-top:var(--space-2); }
    .days { display:grid; gap:var(--space-3); }
    .day-card {
      display:grid; grid-template-columns:1fr auto; gap:var(--space-2) var(--space-4); align-items:center; padding:var(--space-4);
    }
    .day-card .name { font-weight:700; }
    .day-card .meta { color:var(--color-text-muted); font-size:var(--text-sm); }
    .day-card .feel { font-weight:700; text-align:right; }
    .notice, .error {
      padding:var(--space-5); border-radius:22px; background:color-mix(in srgb, var(--color-surface) 88%, transparent);
      border:1px solid color-mix(in srgb, var(--color-text) 10%, transparent); color:var(--color-text-muted);
    }
    .error { color:#c73a50; }
    .footer { color:var(--color-text-faint); font-size:var(--text-xs); padding:var(--space-3) 0 var(--space-4); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="app-title">
        <strong>Feels Like</strong>
        <span>Mobile weather, centered on apparent temperature</span>
      </div>
      <button class="icon-btn" data-theme-toggle aria-label="Toggle theme"></button>
    </header>

    <div class="actions">
      <label class="search" aria-label="Search city">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="cityInput" type="text" placeholder="Search city, e.g. Stavanger" />
      </label>
      <button id="searchBtn" class="primary-btn">Search</button>
    </div>

    <main id="app" class="stack">
      <div class="notice">Trying to use your location first. If you deny access, you can search for a city instead.</div>
    </main>
  </div>

  <script>
    const app = document.getElementById('app');
    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');
    const root = document.documentElement;
    const toggle = document.querySelector('[data-theme-toggle]');
    let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

    function setTheme() {
      root.setAttribute('data-theme', theme);
      toggle.innerHTML = theme === 'dark'
        ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
        : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
    }
    toggle.addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; setTheme(); });
    setTheme();

    function fmtTemp(v){ return `${Math.round(v)}°`; }
    function fmtTime(iso){ return new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(iso)); }
    function fmtDate(iso){ return new Date(iso).toLocaleDateString([], { month:'short', day:'numeric' }); }
    function fmtDay(iso,i){ if(i===0) return 'Today'; return new Date(iso).toLocaleDateString([], { weekday:'long' }); }

    async function geocodeCity(name){
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=en&format=json`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('Search failed');
      const data = await res.json();
      if(!data.results || !data.results.length) throw new Error('No place found');
      const place = data.results[0];
      return {
        name: [place.name, place.admin1, place.country].filter(Boolean).join(', '),
        latitude: place.latitude,
        longitude: place.longitude,
        source: 'search'
      };
    }

    async function loadWeather(latitude, longitude, placeName, sourceLabel){
      app.innerHTML = '<div class="notice">Loading weather…</div>';
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,apparent_temperature,wind_speed_10m,relative_humidity_2m&hourly=temperature_2m,apparent_temperature&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min&forecast_days=7&timezone=auto`;
      try {
        const res = await fetch(url);
        if(!res.ok) throw new Error('Weather fetch failed');
        const data = await res.json();
        renderWeather(data, placeName, sourceLabel);
      } catch (e) {
        app.innerHTML = '<div class="error">Could not load weather for that location right now.</div>';
      }
    }

    function renderWeather(data, placeName, sourceLabel){
      const nowIso = data.current.time;
      const today = nowIso.slice(0,10);
      const nowHour = data.hourly.time.indexOf(nowIso);
      const todayHours = data.hourly.time.map((time, i) => ({
        time,
        feel: data.hourly.apparent_temperature[i],
        air: data.hourly.temperature_2m[i]
      })).filter(h => h.time.slice(0,10) === today);
      const visibleHours = todayHours.slice(Math.max(0, nowHour), Math.max(0, nowHour) + 6);
      const days = data.daily.time.map((time, i) => ({
        time,
        airMin: data.daily.temperature_2m_min[i],
        airMax: data.daily.temperature_2m_max[i],
        feelMin: data.daily.apparent_temperature_min[i],
        feelMax: data.daily.apparent_temperature_max[i]
      }));
      const todayRange = days[0];

      app.innerHTML = `
        <section class="hero">
          <div class="place-row">
            <div>
              <div class="label">Current location</div>
              <div class="place">${placeName}</div>
            </div>
            <div class="status-pill">${sourceLabel}</div>
          </div>
          <div class="main-temp">${fmtTemp(data.current.apparent_temperature)}</div>
          <div class="subline">Feels like now · Air temperature ${fmtTemp(data.current.temperature_2m)}</div>
          <div class="top-range">
            <div class="range-pill">Today low <strong>${fmtTemp(todayRange.feelMin)}</strong></div>
            <div class="range-pill">Today high <strong>${fmtTemp(todayRange.feelMax)}</strong></div>
          </div>
          <div class="hero-grid">
            <div class="mini"><div class="k">Humidity</div><div class="v">${Math.round(data.current.relative_humidity_2m)}%</div></div>
            <div class="mini"><div class="k">Wind</div><div class="v">${Math.round(data.current.wind_speed_10m)} km/h</div></div>
            <div class="mini"><div class="k">Timezone</div><div class="v">${data.timezone_abbreviation}</div></div>
          </div>
        </section>

        <section class="stack">
          <div class="section-title"><h2>Today by hour</h2><span>Next 6 hours</span></div>
          <div class="hourly-strip">
            ${visibleHours.map(h => `
              <article class="hour-card">
                <time datetime="${h.time}">${fmtTime(h.time)}</time>
                <div class="hour-main">${fmtTemp(h.feel)}</div>
                <div class="hour-sub">Air ${fmtTemp(h.air)}</div>
              </article>
            `).join('')}
          </div>
        </section>

        <section class="stack">
          <div class="section-title"><h2>Next 7 days</h2><span>Feels like first</span></div>
          <div class="days">
            ${days.map((d,i) => `
              <article class="day-card">
                <div>
                  <div class="name">${fmtDay(d.time, i)}</div>
                  <div class="meta">${fmtDate(d.time)} · Air ${fmtTemp(d.airMin)} to ${fmtTemp(d.airMax)}</div>
                </div>
                <div class="feel">${fmtTemp(d.feelMin)} → ${fmtTemp(d.feelMax)}</div>
              </article>
            `).join('')}
          </div>
        </section>

        <div class="footer">Uses browser geolocation when available and Open-Meteo forecast data.</div>
      `;
    }

    async function tryCurrentLocation(){
      if (!navigator.geolocation) {
        app.innerHTML = '<div class="notice">Your browser does not support location detection here. Search for a city instead.</div>';
        return loadDefault();
      }
      navigator.geolocation.getCurrentPosition(
        async position => {
          const { latitude, longitude } = position.coords;
          await loadWeather(latitude, longitude, 'Your current location', 'GPS');
        },
        async () => {
          app.innerHTML = '<div class="notice">Location access was not available. Showing Stavanger as a default location. You can also search for any city.</div>';
          await loadWeather(58.9701, 5.7331, 'Stavanger, Rogaland, Norway', 'Default location');
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
      );
    }

    async function loadDefault(){
      await loadWeather(58.9701, 5.7331, 'Stavanger, Rogaland, Norway', 'Default location');
    }

    searchBtn.addEventListener('click', async () => {
      const q = cityInput.value.trim();
      if (!q) return;
      app.innerHTML = '<div class="notice">Searching…</div>';
      try {
        const place = await geocodeCity(q);
        await loadWeather(place.latitude, place.longitude, place.name, 'Search');
      } catch (e) {
        app.innerHTML = '<div class="error">No matching city found. Try a broader search like Stavanger or Oslo.</div>';
      }
    });

    cityInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') searchBtn.click();
    });

    tryCurrentLocation();
  </script>
</body>
</html>
